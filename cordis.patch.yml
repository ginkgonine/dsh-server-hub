# DSH Server Hub profile bundle.
# Install on the main controller and each monitored remote DSH profile.
- insert:
    - id: dsh-server-hub
      name: dsh-server-hub
      inject: [webServer, connection, timer, agents]
    # DSH 0.2 remote Agent service. Execution stays off until workspace opt-in in the UI.
    - id: dsh-server-hub-remote
      name: dsh-server-hub/remote
      inject: [webServer, connection, storage, storage.backend.json, credentials, workspaceRegistry, sessionController, sessions, tools, subagents]
